<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colour Switcher</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:"Trebuchet MS", sans-serif; background:#ffffff; transition:background .6s; }
    .panel { background:rgba(255,255,255,.85); padding:40px 56px; border-radius:16px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.2); }
    #label { font-size:1.8rem; font-weight:bold; margin:16px 0 24px; }
    #hex { font-family:monospace; color:#555; }
    button { padding:12px 30px; font-size:1.05rem; border:0; border-radius:8px; background:#333; color:#fff; cursor:pointer; }
    button:hover { background:#000; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Colour Switcher</h1>
    <p>Current colour:</p>
    <div id="label">White <span id="hex">(#ffffff)</span></div>
    <button id="btn">Change Colour</button>
  </div>

  <script>
    const palette = [
      { name: "Tomato",     code: "#ff6347" },
      { name: "Sky Blue",   code: "#87ceeb" },
      { name: "Lime Green", code: "#32cd32" },
      { name: "Gold",       code: "#ffd700" },
      { name: "Orchid",     code: "#da70d6" },
      { name: "Coral",      code: "#ff7f50" },
      { name: "Teal",       code: "#20b2aa" }
    ];
    let position = -1;

    const label = document.getElementById("label");
    const button = document.getElementById("btn");

    button.addEventListener("click", () => {
      position = (position + 1) % palette.length;
      const { name, code } = palette[position];
      document.body.style.background = code;
      label.innerHTML = `${name} <span id="hex">(${code})</span>`;
    });
  </script>
</body>
</html>
